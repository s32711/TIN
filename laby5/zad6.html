<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Zadanie 6</title>
</head>
<body>
<script>
  function choinkaNoca(n) {
    const szerokosc = 2 * n - 3;

    for (let i = 1; i <= n; i++) {
      if (i === 1 || i === n) {
        console.log('*'.repeat(szerokosc));
      } else {
        const iloscGwiazdek = n - i;
        const iloscSpacji = 2 * i - 3;

        const gwiazdki = '*'.repeat(iloscGwiazdek);
        const spacje = ' '.repeat(iloscSpacji);

        console.log(gwiazdki + spacje + gwiazdki);
      }
    }
  }

  choinkaNoca(6);
</script>
</body>
</html>
