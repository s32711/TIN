<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 2</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
<div class="tlo">

  <div id="okno-wynikow">0</div>

  <div class="kontrola">

    <div class="wejscie">
      <label for="num1">Pierwsza liczba</label>
      <input type="number" id="num1">
    </div>

    <div class="wejscie">
      <label for="num2">Druga liczba</label>
      <input type="number" id="num2">
    </div>

    <div class="wejscie">
      <label for="operacja">Działanie</label>
      <select id="operacja">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
      </select>
    </div>

    <button id="oblicz">Oblicz</button>

  </div>
</div>

<script src="script2.js"></script>
</body>
</html>
